[package]
name = "dns_lab"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Experimental DNS-tunneling messenger: encrypted, compressed chat carried inside DNS queries (RFC 1035)."
license = "MIT"
readme = "README.md"
keywords = ["dns", "tunnel", "messenger", "encryption", "chaos"]
categories = ["network-programming", "command-line-utilities"]
repository = "https://github.com/mirged/dns_lab"
homepage = "https://github.com/mirged/dns_lab"

[features]
# Desktop GUI is the default for local development and end users.
default = ["gui", "audio"]
# Optional egui/eframe front-end. Disable with `--no-default-features` to build
# the tiny headless server/CLI binary (no graphics stack pulled in).
gui = ["dep:eframe"]
# Microphone capture and speaker playback for push-to-talk voice. Kept separate
# from `gui` so a headless relay can still receive voice (to disk) without a
# sound stack, and so `--no-default-features` stays tiny.
audio = ["dep:cpal"]
# Build the JNI bridge on a non-Android host so its logic can be smoke-tested
# from a plain JVM (see android/test/README.md). On Android it is always on.
jni-bridge = []

[dependencies]
simple-dns = "0.12.0"
data-encoding = "2.6"
chacha20poly1305 = "0.11.0"
# Pure-Rust DEFLATE: compresses real chat text far better than SMAZ.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# HKDF-SHA256 for real key derivation from the configured passphrase.
hkdf = "0.12"
sha2 = "0.10"
# Per-node identities: Ed25519 signatures (authenticity) and X25519 agreement
# (per-recipient payload keys once a peer is pinned).
ed25519-dalek = { version = "3.0", default-features = false }
curve25519-dalek = { version = "5.0", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
# Pure-Rust Codec 2 (LGPL-2.1/MIT): 3200 or 2400 bps speech, no C toolchain, so
# the Android build needs no NDK cross-compilation for it.
codec2 = "0.3.1"
# Audio I/O for push-to-talk (feature `audio`): ALSA on Linux, AAudio on Android
# (needs RECORD_AUDIO granted), CoreAudio/WASAPI elsewhere.
cpal = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# JNI surface used by the Android app's Java UI (src/bridge.rs). Harmless on
# desktop, where the module is only compiled with the `jni-bridge` feature.
jni = "0.21"
ndk-context = "0.1"

# Desktop GUI (X11/Wayland). Optional so the headless build never pulls winit.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.36", optional = true, default-features = true }

# Android GUI: glow/EGL, no accesskit (incompatible with native-activity).
# Kept under cfg(target_os = "android") so desktop builds never see these.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
android-activity = { version = "0.6", features = ["native-activity"] }

[lib]
name = "dns_lab"
crate-type = ["rlib", "cdylib"]

[package.metadata.android]
package = "com.dnslab.messenger"
apk_name = "dns-lab"
build_targets = ["aarch64-linux-android"]
# The UI is plain Java (no AndroidX, no Gradle): cargo-apk2 compiles these
# sources with javac against android.jar, dexes them and packages the APK.
java_sources = "android/src"

# These live under `[.sdk]`: they map to the manifest's <uses-sdk>, and
# cargo-apk2 only reads them from there. Kept flat they are silently ignored
# and the build defaults to API 24, where `-laaudio` (and voice) does not link.
# API 26 (Android 8.0): AAudio, which cpal's Android backend needs for the
# microphone and speaker, only exists from here. Chat worked on 24; voice does
# not, and a device without AAudio would fail to open any audio stream.
[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "DNS Lab"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# Push-to-talk. Android grants dangerous permissions at runtime, so on a phone
# the first "hold to talk" may need Settings > Apps > DNS Lab > Permissions >
# Microphone > Allow (the GUI reports the failure instead of crashing).
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

# The activity is ours: a Java UI that talks to the Rust core over JNI.
[[package.metadata.android.application.activity]]
name = "com.dnslab.messenger.MainActivity"
label = "DNS Lab"
exported = true
window_soft_input_mode = "adjustResize"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
