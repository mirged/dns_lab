name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tiny target: proves the headless build pulls in zero graphics dependencies.
  headless:
    name: Headless check (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless
      - name: cargo check (headless)
        run: cargo check --no-default-features --verbose

  # Full target: desktop GUI + all tests + lints.
  test:
    name: Test & lint (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # System libraries required to build/link the egui/eframe desktop GUI.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libwayland-dev

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test --all-targets --verbose
